<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Expiry Alerts</title>
    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
    <link rel="stylesheet" href="css/index.css">
  </head>
  <body>
    <div class="card" id="card">
      <div class="card__bar"></div>

      <!-- ============ MAIN SCREEN ============ -->
      <div id="screen-main" class="screen">

        <header class="head">
          <div class="head__row">
            <div id="hero" class="hero hidden">
              <span class="hero__dot"></span>
              <span id="typeText" class="hero__type"></span>
            </div>
            <div class="head__actions">
              <button type="button" class="sq-btn js-min" aria-label="Minimize" title="Minimize">
                <svg class="ico-min" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <svg class="ico-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"></polyline></svg>
              </button>
              <button type="button" class="sq-btn js-close" aria-label="Close" title="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            </div>
          </div>

          <div id="meta" class="head__meta hidden">
            <span id="jurisWrap" class="juris">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1.5"></rect><path d="M9 7.5h.01M15 7.5h.01M9 11.5h.01M15 11.5h.01"></path><path d="M10 21v-4h4v4"></path></svg>
              <span id="jurisText"></span>
            </span>
            <span id="clientBadge" class="badge" tabindex="0"></span>
            <div id="recvBadge" class="recv hidden"></div>
            <button type="button" id="emailBlock" class="eb hidden" aria-label="PC email is blocked by Zoho CRM">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v6"></path><path d="M12 17h.01"></path></svg>
            </button>
          </div>
        </header>

        <!-- Important Info strip (small, right after the header) -->
        <section id="note-strip" class="note-strip hidden">
          <span class="note-strip__ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
          </span>
          <p id="noteLine" class="note-strip__text"><strong>Important Info:</strong> <span id="noteText"></span></p>
          <button type="button" id="notesBtn" class="note-strip__btn hidden" aria-label="View all notes">
            <span id="notesCount"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
          </button>
        </section>

        <!-- LOADING -->
        <div id="loader" class="state">
          <div class="spinner"></div>
          <p>Loading account alerts…</p>
        </div>

        <!-- MAIN -->
        <main id="main-view" class="body hidden">
          <section id="dates-group" class="group">
            <div class="group__head">
              <span class="group__title">Expiry Dates</span>
            </div>
            <div id="rows" class="group__items"></div>
          </section>
        </main>

        <!-- ERROR -->
        <main id="error-view" class="body hidden">
          <div class="banner banner--urgent">
            <span class="banner__ico">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.8 19a1.5 1.5 0 0 0 1.3 2.2h15.8a1.5 1.5 0 0 0 1.3-2.2L12 3Z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
            </span>
            <div class="banner__text">
              <strong id="error-title">Couldn't load alerts</strong>
              <span id="error-message">Something went wrong while loading this account's data.</span>
            </div>
          </div>

          <section class="group">
            <div class="group__head">
              <span class="group__title">Technical Details</span>
              <button type="button" id="copyBtn" class="link-btn">Copy</button>
            </div>
            <pre id="debug" class="debug"></pre>
          </section>
        </main>
      </div>

      <!-- ============ NOTES SCREEN ============ -->
      <div id="screen-notes" class="screen hidden">
        <header class="head">
          <div class="head__row">
            <div class="head__left">
              <button type="button" id="backBtn" class="sq-btn" aria-label="Back" title="Back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
              </button>
              <div class="head__text">
                <h1>Important Info</h1>
                <p id="notesSub"></p>
              </div>
            </div>
            <div class="head__actions">
              <button type="button" class="sq-btn js-min" aria-label="Minimize" title="Minimize">
                <svg class="ico-min" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <svg class="ico-max" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"></polyline></svg>
              </button>
              <button type="button" class="sq-btn js-close" aria-label="Close" title="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
            </div>
          </div>
        </header>

        <main class="body">
          <div id="notes-list" class="group__items"></div>
        </main>
      </div>

      <!-- Blocked-email explanation (shown on hover / click of the header badge) -->
      <div id="ebPop" class="eb-pop hidden" role="tooltip"></div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
